name: refresh svgs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.60.1
      - run: python scripts/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if numbers changed
        run: |
          # the date label changes daily, so only commit when a number moved
          if git diff --quiet -I 'updated [0-9-]*' -- assets; then
            echo "no change"; git checkout -- assets; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "refresh profile numbers"
          git push
